[project]
name = "open-msme-crm"
version = "0.1.0"
description = "Agentic MSME corporate-banking CRM with human-in-the-loop controls"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "psycopg[binary,pool]>=3.3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain-core>=1.8,<2",
    "sse-starlette>=3.7",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.4",
    "python-multipart>=0.0.20",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "DTZ", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
